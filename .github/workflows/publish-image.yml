# KJS Publish GHCR Image Workflow - Runs ONLY on commits to main
# NOT manually triggerable - only triggered by push to main
#
# Publishing shape:
#   Each architecture is BUILT ON ITS OWN NATIVE RUNNER (no QEMU emulation):
#     linux/amd64 -> ubuntu-26.04
#     linux/arm64 -> ubuntu-26.04-arm
#   Each pushes an arch-suffixed tag:
#     :oracle-latest-amd64        :oracle-<DDMMYYYY>-amd64
#     :oracle-latest-arm64        :oracle-<DDMMYYYY>-arm64
#   A third job joins those per-arch manifests into the multi-arch tags that
#   humans actually pull:
#     :oracle-latest               :oracle-<DDMMYYYY>
#   Those combined tags are what `image: ghcr.io/karljsamuel/hindsight:oracle-latest`
#   in docker-compose resolves, on both amd64 and arm64 hosts.
#
# Why the arch suffix matters: a single build-and-push job per architecture that
# pushed the SAME unsuffixed tag made the two matrix jobs race, and whichever
# finished last silently overwrote the other's architecture -- the published tag
# was single-arch despite the job name. Suffixing removes the collision; the
# combine job then does the only step allowed to write the shared tag.

name: KJS Publish GHCR Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/standalone/Dockerfile.oracle'
      - 'hindsight-api-slim/hindsight_api/**'
      - 'hindsight-control-plane/**'
      - 'smoketest.sh'
      - '.github/workflows/publish-image.yml'
  # NOT on: workflow_dispatch, schedule, pull_request

permissions:
  contents: read
  packages: write

# The per-arch tags (oracle-latest-amd64 / -arm64) are mutable, and the combine
# job assembles them into the shared multi-arch tag. Two runs overlapping on the
# same ref would interleave -- run A pushes amd64, run B pushes amd64, run A
# pushes arm64, run A combines -- and the published manifest would mix two
# different commits. Cancelling the superseded run removes that interleaving:
# the surviving run always rebuilds both architectures before combining.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the date tag once. Computing `date -u` independently in each job
  # meant a build crossing UTC midnight produced arch tags dated D1 while the
  # combine job looked for D2 tags, failing the combine or -- worse -- combining
  # the previous day's arch tags under today's date. A matrix job is a poor
  # carrier for this because matrix outputs are last-writer-wins.
  prepare:
    name: KJS Resolve publish tags
    runs-on: ubuntu-26.04
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - name: Compute date tag
        id: date
        run: echo "date_tag=$(date -u +'%d%m%Y')" >> $GITHUB_OUTPUT

  build-arch:
    name: KJS Build ${{ matrix.arch }}
    needs: [prepare]
    strategy:
      fail-fast: false
      # One architecture built at a time. The two builds are independent and
      # could run in parallel, but only a single image is wanted in flight at
      # any moment, so max-parallel serialises them. Each still runs natively on
      # its own architecture runner -- this is sequencing, not emulation.
      max-parallel: 1
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute arch-suffixed tags
        id: tags
        env:
          DATE_TAG: ${{ needs.prepare.outputs.date_tag }}
        run: |
          REPO=ghcr.io/karljsamuel/hindsight
          echo "tags=${REPO}:oracle-latest-${{ matrix.arch }},${REPO}:oracle-${DATE_TAG}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: Extract labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/karljsamuel/hindsight
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.date_tag }}

      # No local ML models. Embeddings and reranking both resolve to OpenRouter
      # at runtime, so torch/sentence-transformers are deliberately absent --
      # several GB per architecture and unused by any deployment here.
      - name: Build and push arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/standalone/Dockerfile.oracle
          target: oracle-full
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INCLUDE_LOCAL_MODELS=false
            PRELOAD_ML_MODELS=false
            ORACLEDB_VERSION=26.0.1
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  combine-manifest:
    name: KJS Combine multi-arch manifest
    needs: [prepare, build-arch]
    runs-on: ubuntu-26.04
    env:
      DATE_TAG: ${{ needs.prepare.outputs.date_tag }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          REPO=ghcr.io/karljsamuel/hindsight
          docker buildx imagetools create \
            --tag "${REPO}:oracle-latest" \
            "${REPO}:oracle-latest-amd64" \
            "${REPO}:oracle-latest-arm64"
          docker buildx imagetools create \
            --tag "${REPO}:oracle-${DATE_TAG}" \
            "${REPO}:oracle-${DATE_TAG}-amd64" \
            "${REPO}:oracle-${DATE_TAG}-arm64"

      - name: Verify combined manifest has both architectures
        run: |
          REPO=ghcr.io/karljsamuel/hindsight
          rc=0
          for ref in "${REPO}:oracle-latest" "${REPO}:oracle-${DATE_TAG}"; do
            echo "=== ${ref} ==="
            # Tolerate whitespace: `imagetools inspect --raw` is compact today,
            # but a pretty-printed index would make a whitespace-sensitive
            # pattern match nothing and report both arches missing.
            archs=$(docker buildx imagetools inspect "${ref}" --raw \
              | tr -d '[:space:]' \
              | grep -o '"architecture":"[a-z0-9]*"' \
              | sort -u)
            echo "${archs}"
            for want in amd64 arm64; do
              echo "${archs}" | grep -q "\"${want}\"" || { echo "MISSING ${want} in ${ref}"; rc=1; }
            done
          done
          exit $rc

      - name: Output published tags
        run: |
          REPO=ghcr.io/karljsamuel/hindsight
          echo "=== Published Image Tags (multi-arch) ==="
          echo "${REPO}:oracle-latest"
          echo "${REPO}:oracle-${DATE_TAG}"
          echo "Per-arch: oracle-latest-amd64, oracle-latest-arm64"
          echo "Platforms: linux/amd64, linux/arm64"
# PR Validation Workflow - Runs on PRs to main and kjs-edits
# Sequential: Repository Check → Build amd64 + Smoke Test → Build arm64 + Smoke Test → Validation Summary

name: KJS-PR Validation

on:
  pull_request:
    branches: [main, kjs-edits]
    paths:
      - 'docker/standalone/Dockerfile.oracle'
      - 'hindsight-api-slim/hindsight_api/**'
      - 'hindsight-control-plane/**'
      - 'smoketest.sh'
      # Any workflow change, not just this one. The previous list named only
      # pr-validation.yml, so a PR touching nothing but another workflow file
      # triggered no validation at all -- which is how the docker-run tag
      # regression in oracle-image.yml merged with a fully green PR pipeline.
      - '.github/workflows/**'

concurrency:
  group: kjs-oracle-smoke-test
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  validate-repository:
    name: KJS-PR Repository Check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for merge conflicts
        run: |
          echo "Checking for merge conflicts with base branch..."
          git fetch origin ${{ github.base_ref }}
          if ! git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q '<<<<<<<'; then
            echo "No merge conflicts detected"
          else
            echo "Merge conflicts detected"
            exit 1
          fi

      - name: Validate changed files
        # An upstream sync PR integrates upstream's own tree wholesale, so it
        # necessarily touches paths unrelated to Oracle compatibility - which is
        # what this gate constrains. The gate exists to stop an Oracle branch
        # from silently changing unrelated parts of the repo (leaked credential
        # files being the main concern), not to constrain upstream's own content,
        # so an upstream-sync branch from this repository is exempt. Scoped to
        # same-repo heads: github.head_ref carries only the branch name, so a
        # fork branch named upstream-sync-* would otherwise skip the gate too.
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Validating changed files..."
          if [[ "$HEAD_REF" == upstream-sync-* && "$HEAD_REPO" == "$REPO" ]]; then
            echo "Branch $HEAD_REF is an upstream sync - file gate skipped by design."
            exit 0
          fi
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          
          # This gate exists to stop an Oracle branch from silently changing
          # unrelated parts of the repo (leaked credential files being the main
          # concern). .gitignore is allowed because changes to it only ever
          # *exclude* paths -- an added ignore rule cannot disclose a secret,
          # it prevents one. Blocking it would leave local .env files and
          # scratch scripts merely untracked rather than ignored.
          #
          # hindsight-api-slim/tests/ is allowed on the same reasoning: it is a
          # tracked sibling of hindsight_api/ (already allowed in full) and a
          # test module cannot disclose a secret any more than the module it
          # covers. It was omitted rather than excluded, which blocked three
          # regression tests for defects that fail silently -- claims taking the
          # newest work instead of the oldest, date_trunc('quarter') returning a
          # day bucket, and year-0001 timestamps. Coverage for those is worth
          # more than the rule it was never written to enforce.
          ALLOWED_PREFIXES=(
            "docker/standalone/Dockerfile.oracle"
            "hindsight-api-slim/hindsight_api/"
            "hindsight-api-slim/tests/"
            "hindsight-control-plane/"
            "smoketest.sh"
            ".github/workflows/"
            ".gitignore"
          )
          
          for file in $CHANGED; do
            ALLOWED=false
            for prefix in "${ALLOWED_PREFIXES[@]}"; do
              if [[ "$file" == "$prefix"* ]]; then
                ALLOWED=true
                break
              fi
            done
            if [ "$ALLOWED" = false ]; then
              echo "Disallowed file changed: $file"
              exit 1
            fi
          done
          echo "All changed files are allowed"

      - name: Verify smoketest.sh is executable
        run: |
          if [ -f smoketest.sh ] && [ ! -x smoketest.sh ]; then
            echo "Making smoketest.sh executable"
            chmod +x smoketest.sh
          fi
          echo "smoketest.sh ready"

  build-amd64:
    name: KJS-PR Build amd64 + Smoke Test
    needs: validate-repository
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      KJS_TEST_ODB_PASSWORD: ${{ secrets.KJS_TEST_ODB_PASSWORD }}
      KJS_TEST_LLM_API_KEY: ${{ secrets.KJS_TEST_LLM_API_KEY }}
      KJS_TEST_NVIDIA_API_KEY: ${{ secrets.KJS_TEST_NVIDIA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: localhost/hindsight-oracle-test
          tags: |
            type=raw,value=latest

      - name: Build Oracle unified image (load for testing)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/standalone/Dockerfile.oracle
          target: oracle-full
          platforms: linux/amd64
          push: false
          load: true
          tags: localhost/hindsight-oracle-test:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INCLUDE_LOCAL_MODELS=false
            PRELOAD_ML_MODELS=false
            ORACLEDB_VERSION=26.0.1

      - name: Run smoke test on loaded image
        run: |
          chmod +x smoketest.sh
          ./smoketest.sh localhost/hindsight-oracle-test:latest

  build-arm64:
    name: KJS-PR Build arm64 + Smoke Test
    needs: build-amd64
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    env:
      KJS_TEST_ODB_PASSWORD: ${{ secrets.KJS_TEST_ODB_PASSWORD }}
      KJS_TEST_LLM_API_KEY: ${{ secrets.KJS_TEST_LLM_API_KEY }}
      KJS_TEST_NVIDIA_API_KEY: ${{ secrets.KJS_TEST_NVIDIA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: localhost/hindsight-oracle-test
          tags: |
            type=raw,value=latest

      - name: Build Oracle unified image (load for testing)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/standalone/Dockerfile.oracle
          target: oracle-full
          platforms: linux/arm64
          push: false
          load: true
          tags: localhost/hindsight-oracle-test:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INCLUDE_LOCAL_MODELS=false
            PRELOAD_ML_MODELS=false
            ORACLEDB_VERSION=26.0.1

      - name: Run smoke test on loaded image
        run: |
          chmod +x smoketest.sh
          ./smoketest.sh localhost/hindsight-oracle-test:latest

  test-api-oracle:
    name: Oracle API Tests (after both smoke tests)
    needs: build-arm64
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      HINDSIGHT_API_LLM_PROVIDER: openrouter
      HINDSIGHT_API_LLM_BASE_URL: https://openrouter.ai/api/v1
      HINDSIGHT_API_LLM_API_KEY: ${{ secrets.KJS_TEST_LLM_API_KEY }}
      HINDSIGHT_API_LLM_MODEL: nvidia/nemotron-3.5-super-vl:free
      HINDSIGHT_API_LLM_REASONING_EFFORT: low
      HINDSIGHT_API_DATABASE_BACKEND: oracle
      HINDSIGHT_API_DATABASE_SCHEMA: HINDSIGHT_TEST
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: nvidia
      HINDSIGHT_API_EMBEDDINGS_NVIDIA_BASE_URL: https://openrouter.ai/api/v1
      HINDSIGHT_API_EMBEDDINGS_NVIDIA_API_KEY: ${{ secrets.KJS_TEST_LLM_API_KEY }}
      HINDSIGHT_API_EMBEDDINGS_NVIDIA_MODEL: nvidia/nemotron-3.5-embed-1b:free
      HINDSIGHT_API_EMBEDDINGS_NVIDIA_DIMENSIONS: 2048
      HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: 2048
      HINDSIGHT_API_EMBEDDINGS_ONNX_DIMENSIONS: 2048
      HINDSIGHT_API_RERANKER_PROVIDER: openrouter
      HINDSIGHT_API_RERANKER_OPENROUTER_MODEL: nvidia/nemotron-3.5-rerank-8b:free
      HINDSIGHT_API_RERANKER_OPENROUTER_API_KEY: ${{ secrets.KJS_TEST_LLM_API_KEY }}
      ORACLE_TEST_USER: HINDSIGHT_TEST
      ORACLE_TEST_PASSWORD: ${{ secrets.KJS_TEST_ODB_PASSWORD }}
      KJS_TEST_ODB_PASSWORD: ${{ secrets.KJS_TEST_ODB_PASSWORD }}
      ORACLE_TEST_DSN: "(description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.ap-hyderabad-1.oraclecloud.com))(connect_data=(service_name=g4a90f2577f59fb_hindsightdb_high.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          prune-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install API dependencies
        working-directory: ./hindsight-api-slim
        run: uv sync --frozen --all-extras --index-strategy unsafe-best-match
      - name: Reset Oracle test schema (smoke-test cleanup)
        working-directory: ./hindsight-api-slim
        run: |
          uv run python - <<'PY'
          import os
          import oracledb

          conn = oracledb.connect(
              user=os.environ.get("ORACLE_TEST_USER", "HINDSIGHT_TEST"),
              password=os.environ["ORACLE_TEST_PASSWORD"],
              dsn=os.environ["ORACLE_TEST_DSN"],
          )
          cursor = conn.cursor()
          errors = 0
          cursor.execute("""
              SELECT index_name, index_type FROM user_indexes
              WHERE index_type IN ('DOMAIN', 'VECTOR')
          """)
          indexes = cursor.fetchall()
          errors = 0
          for index_name, index_type in indexes:
              try:
                  cursor.execute(f'DROP INDEX "{index_name}"')
              except oracledb.DatabaseError as exc:
                  message = str(exc)
                  if "ORA-01418" in message or "ORA-00942" in message:
                      continue
                  print(f"Could not drop {index_type} index {index_name}: Oracle error")
                  errors += 1
          conn.commit()

          cursor.execute("""
              SELECT table_name FROM user_tables
              WHERE table_name NOT LIKE :pattern
          """, {"pattern": "BIN$%"})
          tables = [row[0] for row in cursor.fetchall()]
          errors = 0
          dropped = 0
          for table in tables:
              try:
                  cursor.execute(f'DROP TABLE "{table}" CASCADE CONSTRAINTS PURGE')
                  dropped += 1
              except oracledb.DatabaseError as exc:
                  message = str(exc)
                  if "ORA-00942" in message or "ORA-51903" in message:
                      continue
                  print(f"Could not drop table {table}: Oracle error")
                  errors += 1
          conn.commit()
          cursor.execute("SELECT COUNT(*) FROM user_tables")
          remaining = cursor.fetchone()[0]
          cursor.close()
          conn.close()
          print(f"Smoke reset complete: {len(indexes)} indexes, {dropped}/{len(tables)} tables dropped, {remaining} remaining")
          if errors or remaining:
              raise SystemExit(f"Schema reset left {remaining} tables and had {errors} unexpected errors")
          PY
      - name: Point the app at the Oracle test database
        # A tcps connect descriptor belongs in the URL's dsn= parameter. Read the
        # password from the environment and append the URL to GITHUB_ENV without
        # printing it or placing it in a command argument.
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          import urllib.parse

          dsn = os.environ["ORACLE_TEST_DSN"]
          pwd = urllib.parse.quote(os.environ["KJS_TEST_ODB_PASSWORD"], safe="")
          url = f"oracle+oracledb://HINDSIGHT_TEST:{pwd}@/?dsn={urllib.parse.quote(dsn, safe='')}"
          print(f"HINDSIGHT_API_DATABASE_URL={url}")
          PY
      - name: Run Oracle API tests
        working-directory: ./hindsight-api-slim
        run: uv run pytest tests -v -m oracle -n0

  validation-summary:
    name: KJS-PR Validation Summary
    needs: [validate-repository, build-amd64, build-arm64, test-api-oracle]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check all validations passed
        run: |
          if [[ "${{ needs.validate-repository.result }}" == "success" && \
                "${{ needs.build-amd64.result }}" == "success" && \
                "${{ needs.build-arm64.result }}" == "success" && \
                "${{ needs.test-api-oracle.result }}" == "success" ]]; then
            echo "All validations passed"
          else
            echo "Some validations failed"
            echo "Repository: ${{ needs.validate-repository.result }}"
            echo "Build amd64: ${{ needs.build-amd64.result }}"
            echo "Build arm64: ${{ needs.build-arm64.result }}"
            echo "Oracle API tests: ${{ needs.test-api-oracle.result }}"
            exit 1
          fi
# PR Validation Workflow - Runs on PRs to main and kjs-edits
# 3 sequential validations: Repository Check → Build Image → Smoke Test
# Only kjsagent can trigger/manage PRs; karljsamuel reviews/approves

name: PR Validation

on:
  pull_request:
    branches: [main, kjs-edits]
    paths:
      - 'docker/standalone/Dockerfile.oracle'
      - 'hindsight-api-slim/hindsight_api/**'
      - 'hindsight-control-plane/**'
      - 'smoketest.sh'
      - '.github/workflows/pr-validation.yml'

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  validate-repository:
    name: 1️⃣ Repository Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for merge conflicts
        run: |
          echo "Checking for merge conflicts with base branch..."
          git fetch origin ${{ github.base_ref }}
          if ! git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q '<<<<<<<'; then
            echo "✅ No merge conflicts detected"
          else
            echo "❌ Merge conflicts detected"
            exit 1
          fi

      - name: Validate changed files
        run: |
          echo "Validating changed files..."
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          
          ALLOWED_PREFIXES=(
            "docker/standalone/Dockerfile.oracle"
            "hindsight-api-slim/hindsight_api/"
            "hindsight-control-plane/"
            "smoketest.sh"
            ".github/workflows/"
          )
          
          for file in $CHANGED; do
            ALLOWED=false
            for prefix in "${ALLOWED_PREFIXES[@]}"; do
              if [[ "$file" == "$prefix"* ]]; then
                ALLOWED=true
                break
              fi
            done
            if [ "$ALLOWED" = false ]; then
              echo "❌ Disallowed file changed: $file"
              exit 1
            fi
          done
          echo "✅ All changed files are allowed"

      - name: Verify smoketest.sh is executable
        run: |
          if [ -f smoketest.sh ] && [ ! -x smoketest.sh ]; then
            echo "Making smoketest.sh executable"
            chmod +x smoketest.sh
          fi
          echo "✅ smoketest.sh ready"

  build-image:
    name: 2️⃣ Build Image
    needs: validate-repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: localhost/hindsight-oracle-test
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build Oracle unified image (load for testing)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/standalone/Dockerfile.oracle
          target: oracle-full
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INCLUDE_LOCAL_MODELS=false
            PRELOAD_ML_MODELS=false
            ORACLEDB_VERSION=26.0.1

      - name: Save image for smoke test
        run: |
          docker save ${{ steps.meta.outputs.tags }} | gzip > image-${{ matrix.platform }}.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-image-${{ matrix.platform }}
          path: image-${{ matrix.platform }}.tar.gz
          retention-days: 1

  smoke-test:
    name: 3️⃣ Smoke Test
    needs: [validate-repository, build-image]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: oracle-image-${{ matrix.platform }}
          path: .

      - name: Load image
        run: |
          gunzip -c image-${{ matrix.platform }}.tar.gz | docker load

      - name: Run smoke test
        run: |
          chmod +x smoketest.sh
          ./smoketest.sh hindsight-oracle-test:latest

  validation-summary:
    name: ✅ Validation Summary
    needs: [validate-repository, build-image, smoke-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all validations passed
        run: |
          if [[ "${{ needs.validate-repository.result }}" == "success" && \
                "${{ needs.build-image.result }}" == "success" && \
                "${{ needs.smoke-test.result }}" == "success" ]]; then
            echo "✅ All validations passed"
          else
            echo "❌ Some validations failed"
            echo "Repository: ${{ needs.validate-repository.result }}"
            echo "Build: ${{ needs.build-image.result }}"
            echo "Smoke Test: ${{ needs.smoke-test.result }}"
            exit 1
          fi
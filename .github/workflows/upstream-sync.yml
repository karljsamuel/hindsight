# KJS Upstream Sync Workflow - Scheduled PR Creation
#
# SCHEDULE: Weekly (configurable day)
# ACTION:
#   1. Fetch upstream/main
#   2. Create new branch: upstream-sync/YYYY-MM-DD
#   3. Combine: upstream/main + kjs-edits changes
#   4. Open PR as kjsagent (using GH_KJSAGENT_PAT)
#   5. PR runs PR Validation workflow automatically
#   6. karljsamuel reviews and merges
#
# NO automatic sync to main - PR must be manually approved and merged
# kjsagent (via GH_KJSAGENT_PAT) can only OPEN PRs
# karljsamuel reviews and approves

name: KJS Upstream Sync

on:
  schedule:
    # Every Monday 06:00 UTC - adjust as needed
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      base_date:
        description: 'Override date for branch name (YYYY-MM-DD)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-sync-pr:
    name: KJS Create Upstream Sync PR
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_KJSAGENT_PAT }}

      - name: Configure git (kjsagent)
        run: |
          git config user.name "kjsagent"
          git config user.email "kjsagent@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/vectorize-io/hindsight.git
          git fetch upstream

      - name: Determine sync date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.base_date }}" ]; then
            SYNC_DATE="${{ github.event.inputs.base_date }}"
          else
            SYNC_DATE=$(date -u +'%Y-%m-%d')
          fi
          echo "sync_date=$SYNC_DATE" >> $GITHUB_OUTPUT
          echo "branch_name=upstream-sync/$SYNC_DATE" >> $GITHUB_OUTPUT

      - name: Create upstream-sync branch
        run: |
          # Start from upstream/main
          git checkout -b ${{ steps.date.outputs.branch_name }} upstream/main

          # Apply kjs-edits changes on top
          # This creates a merge commit combining upstream + our edits
          if git merge --no-ff origin/kjs-edits -m "chore: merge kjs-edits into upstream-sync/${{ steps.date.outputs.sync_date }}"; then
            echo "merge_status=clean" >> $GITHUB_OUTPUT
          else
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            # Keep conflict markers for PR to show
          fi

      - name: Push upstream-sync branch
        run: |
          git push origin ${{ steps.date.outputs.branch_name }} --force-with-lease

      - name: Create PR as kjsagent
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GH_KJSAGENT_PAT }}
          branch: ${{ steps.date.outputs.branch_name }}
          base: main
          title: "upstream-sync/${{ steps.date.outputs.sync_date }}"
          body: |
            **Automated upstream sync PR** - `upstream/main` + `kjs-edits` combined for ${{ steps.date.outputs.sync_date }}.

            **Source:**
            - Base: `upstream/main` (latest upstream)
            - Merged: `origin/kjs-edits` (our Oracle fixes)

            **Merge status:** ${{ steps.merge_status.outputs.merge_status == 'clean' && 'Clean merge' || 'Conflicts detected' }}

            **What changed from upstream:**
            Run `git log --oneline main..${{ steps.date.outputs.branch_name }}` to see upstream commits being integrated.

            **Our edits preserved (kjs-edits):**
            - Oracle 26ai support (VECTOR(2048), native VECTOR_DISTANCE)
            - Oracle dialect fixes (migrations, vector binding, JSON handling)
            - Unified image (API + Control Plane, no local models)
            - Configurable 2048-dim embeddings

            **Validation:**
            This PR will run the **KJS-PR Validation** workflow automatically:
            1. Repository Check (conflicts, allowed files)
            2. Multi-arch Build Test (amd64 + arm64)
            3. Smoke Test (health endpoint, imports, config)

            **Review checklist for karljsamuel:**
            - [ ] KJS-PR Validation passes (all checks green)
            - [ ] No unexpected upstream changes break Oracle compatibility
            - [ ] Schema migrations still apply cleanly
            - [ ] Image builds and smoke test passes

            **After approval:** Merge this PR - triggers **KJS Publish GHCR Image** workflow - image tagged `latest` + `DDMMYYYY`
          labels: "upstream-sync,automated"
          draft: false
          assignees: "karljsamuel"